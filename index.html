<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>合成大歌姬</title>
    <link rel="manifest" href="manifest.json">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#c8dce8;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;height:100vh;width:100vw}

        /* Grid 三栏：左立绘 | 游戏 | 音乐面板(撑满右侧) */
        #app-container{
            display:grid;
            grid-template-columns:1fr 500px 1fr;
            width:100%;
            height:100%;
        }

        /* 左侧立绘 — 限制宽度防止撑开 grid */
        #illustration-panel{
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
            min-width:0;
            max-width:100%;
            background:#c8dce8;
        }
        #illustration-img{
            max-height:100%;
            max-width:100%;
            object-fit:contain;
            opacity:0;
            transition:opacity 0.6s;
        }
        #illustration-name{
            position:absolute;
            bottom:24px;
            left:50%;
            transform:translateX(-50%);
            color:rgba(255,255,255,0.6);
            font-size:16px;
            letter-spacing:4px;
        }

        /* ===== 右侧音乐面板 ===== */
        #music-panel{
            background:rgba(255,255,255,0.95);
            display:flex;
            flex-direction:column;
            overflow:hidden;
            height:100%;
            font-family:'PingFang SC','Microsoft YaHei',sans-serif;
            min-width:0;
            touch-action:manipulation;
        }
        #music-header{
            padding:8px 14px;
            font-size:15px;
            font-weight:bold;
            color:#E02B3D;
            border-bottom:1px solid rgba(224,43,61,0.1);
            flex-shrink:0;
        }
        #music-album-art{
            text-align:center;
            padding:8px 0 4px;
            flex-shrink:0;
        }
        #music-album-art img{
            max-width:70%;
            max-height:120px;
            border-radius:8px;
            object-fit:contain;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }
        #music-list{
            flex:1;
            overflow-y:auto;
            padding:2px 0;
        }
        #music-list::-webkit-scrollbar{width:3px}
        #music-list::-webkit-scrollbar-thumb{background:rgba(224,43,61,0.15);border-radius:3px}
        .music-char-group{margin:0}
        .music-char-name{
            padding:7px 14px;
            font-size:13px;
            font-weight:bold;
            letter-spacing:1px;
            background:rgba(0,0,0,0.02);
            border-bottom:1px solid rgba(0,0,0,0.03);
        }
        .music-char-name.unlocked{color:#E02B3D}
        .music-char-name.locked{color:#bbb}
        .music-songs{margin:0}
        .music-song-item{
            padding:5px 14px 5px 24px;
            font-size:12px;
            color:#666;
            cursor:pointer;
            transition:all 0.12s;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
            line-height:1.7;
        }
        .music-song-item:hover{background:rgba(224,43,61,0.06);color:#E02B3D}
        .music-song-item.active{background:rgba(57,197,187,0.15);color:#39C5BB;font-weight:bold}
        #music-empty{padding:30px 14px;text-align:center;color:#bbb;font-size:12px}

        /* 播放控制栏 */
        #music-player-bar{
            border-top:1px solid rgba(224,43,61,0.12);
            padding:10px 14px 12px;
            flex-shrink:0;
            background:rgba(255,255,255,0.98);
        }
        #music-now-playing{
            font-size:12px;
            color:#555;
            text-align:center;
            margin-bottom:5px;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }
        #music-controls{
            display:flex;
            justify-content:center;
            gap:16px;
            margin-bottom:6px;
        }
        .mc-btn{
            background:none;
            border:none;
            font-size:18px;
            cursor:pointer;
            color:#E02B3D;
            padding:2px 6px;
            transition:transform 0.1s;
        }
        .mc-btn:hover{transform:scale(1.2)}
        .mc-btn.mc-play{font-size:22px}
        #music-progress-wrap{cursor:pointer;width:100%}
        #music-progress-bar{
            height:5px;
            background:rgba(224,43,61,0.1);
            border-radius:3px;
            overflow:hidden;
            margin-bottom:3px;
        }
        #music-progress-fill{
            height:100%;
            background:linear-gradient(90deg,#E02B3D,#39C5BB);
            border-radius:3px;
            transition:width 0.3s;
        }
        #music-time{
            font-size:10px;
            color:#aaa;
            text-align:center;
        }

        /* 游戏框 - 固定宽度 */
        #game-container{
            width:500px;
            flex-shrink:0;
            height:100%;
            display:flex;
            flex-direction:column;
            background:linear-gradient(180deg,#fff5f5 0%,#ffe8ec 50%,#fce4ec 100%);
            border-left:1px solid rgba(224,43,61,0.12);
            border-right:1px solid rgba(224,43,61,0.12);
        }

        /* UI */
        #top-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;color:#fff;font-size:13px;z-index:10;flex-shrink:0}
        #high-score-display{color:#FFD700;font-size:13px}
        #game-title{font-size:20px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#E02B3D,#e04050,#39C5BB);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-shadow:none;transform:rotate(-1deg);font-family:'Comic Sans MS','KaiTi','STKaiti',cursive}
        .title-deco{-webkit-text-fill-color:initial;background:none}
        #top-spacer{width:60px}
        #watermark{position:absolute;top:38px;right:10px;font-size:10px;color:rgba(0,0,0,0.25);z-index:20;pointer-events:none;font-family:'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:1px}
        #game-canvas{flex:1;width:100%;display:block;cursor:pointer}
        #bottom-bar{padding:10px 16px;text-align:center;z-index:10;flex-shrink:0}
        #score-display{color:rgba(0,0,0,0.55);font-size:16px;letter-spacing:2px}
        #score{color:#39C5BB;font-size:28px;font-weight:bold}
        #game-over-panel{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.78);display:flex;align-items:center;justify-content:center;z-index:100}
        #game-over-panel.hidden{display:none}
        #game-over-content{background:linear-gradient(135deg,#1a0c14,#132020);border:2px solid #39C5BB;border-radius:20px;padding:36px 44px;text-align:center;box-shadow:0 0 40px rgba(57,197,187,0.25)}
        #game-over-content h2{font-size:28px;background:linear-gradient(135deg,#E02B3D,#39C5BB);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:16px}
        #game-over-scores p{color:#ccc;font-size:15px;margin:6px 0}
        #final-score{color:#39C5BB;font-size:26px;font-weight:bold}
        #final-high-score{color:#FFD700}
        #restart-btn{margin-top:20px;padding:12px 44px;font-size:17px;border:none;border-radius:25px;background:linear-gradient(135deg,#E02B3D,#39C5BB);color:#fff;cursor:pointer;font-weight:bold;letter-spacing:2px}
        #restart-btn:hover{transform:scale(1.05);box-shadow:0 0 20px rgba(57,197,187,0.5)}
        #restart-btn:active{transform:scale(0.95)}

        /* 手机：隐藏立绘 */
        /* 音乐切换按钮（桌面隐藏，手机显示） */
        #music-toggle-btn{
            display:none;
            position:absolute;
            top:38px;right:8px;
            z-index:30;
            background:rgba(255,255,255,0.9);
            border:1px solid rgba(224,43,61,0.2);
            border-radius:14px;
            padding:3px 8px;
            font-size:13px;
            cursor:pointer;
            color:#E02B3D;
        }
        #music-close-btn{display:none}
        @media(max-width:800px){
            #app-container{grid-template-columns:1fr}
            #illustration-panel{display:none}
            #game-container{width:100%;border:none}
            #music-toggle-btn{display:block}
            #music-panel{
                display:none;
                position:fixed;
                top:0;left:0;right:0;bottom:0;
                z-index:200;
                background:rgba(255,255,255,0.97);
            }
            #music-panel.show{display:flex}
            #music-close-btn{
                display:flex!important;
                align-items:center;
                justify-content:center;
                position:fixed;
                top:12px;right:12px;
                z-index:999;
                width:36px;height:36px;
                background:rgba(224,43,61,0.9);
                border:none;
                border-radius:50%;
                font-size:18px;
                cursor:pointer;
                color:#fff;
                box-shadow:0 2px 8px rgba(0,0,0,0.3);
            }
        }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- 立绘区 -->
        <div id="illustration-panel" style="position:relative;">
            <img id="illustration-img" src="" alt="">
            <div id="illustration-name"></div>
        </div>
        <!-- 游戏区 -->
        <div id="game-container" style="position:relative;">
                <div id="top-bar">
                    <div id="high-score-display">🏆 最高: <span id="high-score">0</span></div>
                    <div id="game-title"><span class="title-deco">🎤</span>合成大歌姬<span class="title-deco">🎵</span></div>
                    <div id="top-spacer"></div>
                </div>
                <canvas id="game-canvas"></canvas>
                <button id="music-toggle-btn" onclick="document.getElementById('music-panel').classList.toggle('show');this.textContent=document.getElementById('music-panel').classList.contains('show')?'✕':'🎵'">🎵</button>
                <div id="watermark">B站：时风瞬K</div>
                <div id="bottom-bar">
                    <div id="score-display">分数 <span id="score">0</span></div>
                </div>
                <div id="game-over-panel" class="hidden">
                    <div id="game-over-content">
                        <h2>游戏结束</h2>
                        <div id="game-over-scores">
                            <p>得分 <span id="final-score">0</span></p>
                            <p>最高 <span id="final-high-score">0</span></p>
                        </div>
                        <button id="restart-btn">再来一次</button>
                    </div>
                </div>
            </div>
        <!-- 音乐面板 -->
        <div id="music-panel"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
    <script src="js/fruit.js?v=4"></script>
    <script src="js/physics.js?v=4"></script>
    <script src="js/renderer.js?v=4"></script>
    <script src="js/game.js?v=4"></script>
    <script src="js/music.js?v=1"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
